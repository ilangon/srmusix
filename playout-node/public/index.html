<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SR MUSIX HD — Web Playout</title><link rel="stylesheet" href="style.css">
<script src="/vendor/hls.js"></script></head>
<body><header><div><strong>SR MUSIX HD</strong><span>Universal Web Playout</span></div><div class="lamps"><i id="ffmpegLamp"></i>FFMPEG <i id="outputLamp"></i>OUTPUT</div></header>
<main>
 <section class="panel playlist"><h2>PLAYLIST</h2><div class="toolbar"><label class="button gold">＋ ADD MEDIA<input id="files" type="file" multiple></label><button id="remove">REMOVE</button><button id="clear">CLEAR</button></div><div id="drop">Drop any media files here<br><small>M2P • MPEG • VOB • DAT • TS • MXF • MOV • MKV • MP4 • Audio</small></div><div id="items"></div></section>
 <section class="stage"><div id="screen"><video id="video" playsinline controls></video><img id="logo" alt="Logo"><div id="nowNext">NOW: Standby<br>NEXT: —</div><div id="ticker"><span>SR MUSIX HD • Feel the Music • Live the Vibe</span></div></div>
  <div class="transport"><button id="play" class="green">▶ PLAY</button><button id="pause">Ⅱ PAUSE</button><button id="stop" class="red">■ STOP</button><button id="next">▶| NEXT</button><label>VOL <input id="volume" type="range" min="0" max="100" value="100"></label><label><input id="loop" type="checkbox"> LOOP</label></div>
 </section>
 <section class="panel controls"><h2>OUTPUT & CG</h2><label>Destination<input id="destination" value="rtmp://localhost/live/srmusix"></label><label>Encoder<select id="codec"><option value="h264">NVIDIA H.264</option><option value="h265">NVIDIA H.265</option><option value="h264-cpu">CPU H.264</option></select></label><label>Bitrate (kbps)<input id="bitrate" type="number" value="8000"></label><button id="startOutput" class="gold">START OUTPUT</button><button id="stopOutput">STOP OUTPUT</button><hr><label><input id="showLogo" type="checkbox"> Logo image</label><input id="logoFile" type="file" accept="image/*"><label><input id="showNow" type="checkbox" checked> Now / Next</label><label><input id="showTicker" type="checkbox" checked> Ticker</label><textarea id="tickerText">SR MUSIX HD • Feel the Music • Live the Vibe</textarea><label>Aspect<select id="aspect"><option>16:9</option><option>4:3</option><option>Fill</option></select></label><label>Schedule selected<input id="schedule" type="datetime-local"></label><button id="setSchedule">SET SCHEDULE</button></section>
</main><footer id="status">READY — Add media to begin</footer><script src="app.js"></script></body></html>
