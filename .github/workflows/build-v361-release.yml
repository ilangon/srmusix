name: Build SR MUSIX V3.7.0 Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'playout/**'
      - '.github/workflows/build-v361-release.yml'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playout/package-lock.json
      - name: Install application packages
        working-directory: playout
        run: npm ci
      - name: Download and bundle Full FFmpeg
        shell: powershell
        working-directory: playout
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile "$env:RUNNER_TEMP\ffmpeg-full.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg-full.zip" "$env:RUNNER_TEMP\ffmpeg-full" -Force
          Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-full" -Recurse -Filter '*.exe' | Where-Object { $_.Name -in @('ffmpeg.exe','ffprobe.exe','ffplay.exe') } | Copy-Item -Destination bin -Force
          @('ffmpeg.exe','ffprobe.exe','ffplay.exe') | ForEach-Object { if (-not (Test-Path "bin\$_")) { throw "Missing $_" } }
      - name: Validate software
        working-directory: playout
        run: |
          npm run check
          node renderer-smoke-test.js
      - name: Build Windows portable folder
        working-directory: playout
        run: npx electron-builder --win dir --x64
      - name: Create one Desktop plus Source ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path 'release\Windows_Desktop' | Out-Null
          New-Item -ItemType Directory -Force -Path 'release\Desktop_Web_Source' | Out-Null
          Copy-Item 'playout\dist\win-unpacked\*' 'release\Windows_Desktop' -Recurse -Force
          @('index.html','app.js','main.js','preload.js','style.css','udp.css','v32.css','package.json','package-lock.json','renderer-smoke-test.js','README_TAMIL.txt','WEB_AND_DESKTOP_SOURCE_README_TAMIL.txt','BUILD_WINDOWS_EXE.bat','START_WINDOWS.bat','CHECK_FFMPEG_SUPPORT.bat','INSTALL_FFMPEG_WINDOWS.bat','PREPARE_FULL_FFMPEG_WINDOWS.ps1') | ForEach-Object { Copy-Item "playout\$_" 'release\Desktop_Web_Source' -Force }
          Compress-Archive -Path 'release\*' -DestinationPath 'SR_MUSIX_HD_Playout_V3.7.0_Windows_x64_Full_Codecs.zip' -CompressionLevel Optimal
      - name: Publish V3.7.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.7.0
          name: SR MUSIX HD Playout V3.7.0
          body: One package containing the Windows desktop app plus complete shared Desktop/Web source. Includes seamless RTMP/UDP/SRT relay updates, common program output format, live correction propagation, fast legacy decoder path, CPU/GPU selection and bundled Full FFmpeg.
          files: SR_MUSIX_HD_Playout_V3.7.0_Windows_x64_Full_Codecs.zip
